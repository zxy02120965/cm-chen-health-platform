services:
  mysql:
    image: mysql:8.4
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ai_zxy}
      MYSQL_USER: ${MYSQL_USER:-zxy}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请在.env中设置MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在.env中设置MYSQL_ROOT_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
      - ./database/V1_1__monitoring_messages_history.sql:/docker-entrypoint-initdb.d/002-v1.1.sql:ro
      - ./database/V1_2__assessment_questionnaire_v1_1.sql:/docker-entrypoint-initdb.d/003-assessment-v1.2.sql:ro
      - ./database/seed_v1.sql:/docker-entrypoint-initdb.d/004-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$${MYSQL_ROOT_PASSWORD}\""]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    image: ${REGISTRY_IMAGE:-cm-chen-local}/backend:${IMAGE_TAG:-latest}
    environment:
      DB_HOST: ${DB_HOST:-mysql}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${MYSQL_DATABASE:-ai_zxy}
      DB_USER: ${MYSQL_USER:-zxy}
      DB_PASSWORD: ${MYSQL_PASSWORD:?请在.env中设置MYSQL_PASSWORD}
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build: ./frontend
    image: ${REGISTRY_IMAGE:-cm-chen-local}/frontend:${IMAGE_TAG:-latest}
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  mysql_data:
