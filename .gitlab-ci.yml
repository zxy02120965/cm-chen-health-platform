stages:
  - test
  - build
  - deploy

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  DOCKER_TLS_CERTDIR: "/certs"

backend:test:
  image: python:3.12-slim
  stage: test
  script:
    - cd backend
    - pip install --cache-dir "$PIP_CACHE_DIR" -r requirements.txt
    - pytest -q

frontend:test:
  image: node:22-alpine
  stage: test
  script:
    - cd frontend
    - corepack enable
    - pnpm install --frozen-lockfile
    - pnpm run build
  artifacts:
    paths:
      - frontend/dist/
    expire_in: 1 day

docker:build:
  image: docker:27
  services:
    - docker:27-dind
  stage: build
  script:
    - docker build -t "$CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHA" backend
    - docker build -t "$CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHA" frontend
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
    - docker push "$CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHA"
    - docker push "$CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHA"
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

deploy:production:
  image: alpine:3.21
  stage: deploy
  before_script:
    - apk add --no-cache openssh-client
    - install -m 700 -d ~/.ssh
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
  script:
    - ssh "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$DEPLOY_PATH'"
    - scp docker-compose.yml "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/docker-compose.yml"
    - ssh "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$DEPLOY_PATH/database'"
    - scp database/schema.sql "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/database/schema.sql"
    - ssh "$DEPLOY_USER@$DEPLOY_HOST" "cd '$DEPLOY_PATH' && export IMAGE_TAG='$CI_COMMIT_SHA' REGISTRY_IMAGE='$CI_REGISTRY_IMAGE' && docker compose pull && docker compose up -d"
  environment:
    name: production
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $DEPLOY_HOST && $DEPLOY_USER && $DEPLOY_PATH && $SSH_PRIVATE_KEY'
    - when: never
